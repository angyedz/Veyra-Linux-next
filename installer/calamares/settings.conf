# Calamares UI for the Veyra package-based installer.
modules-search: [ local ]
sequence:
  - show:
      - welcome
      - interactiveterminal
  - show:
      - finished

branding: veyra
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
