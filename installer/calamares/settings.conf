# Experimental Calamares UI: Veyra controls disk selection and confirmation.
# Do not show Calamares' generic "Finished" screen; it cannot tell whether
# the embedded terminal's external installer has failed preflight or completed.
modules-search: [ local ]
sequence:
  - show:
      - welcome
      - interactiveterminal

branding: veyra
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
