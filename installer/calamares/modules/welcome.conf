showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false

# The Qt/Wayland Calamares frontend deliberately runs as liveuser, not root.
# Only the separately preflighted terminal backend gets narrowly scoped sudo.
# A mandatory root requirement here would permanently block installation.
requirements:
    requiredRam: 1.0
    internetCheckUrl: https://download.fedoraproject.org/
    check:
        - ram
        - internet
    required:
        - internet

geoip:
    style: "none"
