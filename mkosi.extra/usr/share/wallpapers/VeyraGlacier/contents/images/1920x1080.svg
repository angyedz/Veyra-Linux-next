  <path d="M600 1080 C780 900 860 750 1020 620 C1260 420 1490 410 1780 180"
        fill="none" stroke="#FBFDFF" stroke-opacity=".35" stroke-width="2"/>
  <path d="M1200 1080 C1430 900 1680 800 1920 690
           L1920 1080 Z" fill="#D8F3FF" fill-opacity=".08"/>
</svg>
