[Include]
Include=mkosi.veyra-base.conf

[Config]
Dependencies=veyra-oci-rootfs
Dependencies=initrd

[Distribution]
Distribution=fedora
Release=44
Architecture=x86-64
RepositoryKeyFetch=yes

[Output]
Format=disk
ElTorito=no
Output=veyra-next
OutputDirectory=mkosi.output
ImageId=veyra-next
ImageVersion=0.1.0
SplitArtifacts=partitions,uki,roothash,os-release,repart-definitions

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
Initrds=%O/initrd
KernelCommandLine=systemd.unit=graphical.target

[Build]
ToolsTree=yes
ToolsTreeDistribution=fedora
ToolsTreeRelease=44

[Runtime]
Firmware=uefi
