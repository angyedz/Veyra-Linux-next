name: Veyra Glacier theme tests

on:
  pull_request:
    paths:
      - 'mkosi.extra/usr/share/color-schemes/**'
      - 'mkosi.extra/etc/xdg/kdeglobals'
      - 'tests/test_glacier_theme.py'
      - '.github/workflows/glacier-theme.yml'
  push:
    branches: [main]
    paths:
      - 'mkosi.extra/usr/share/color-schemes/**'
      - 'mkosi.extra/etc/xdg/kdeglobals'
      - 'tests/test_glacier_theme.py'

permissions:
  contents: read

jobs:
  theme-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_glacier_theme.py' -v
      - run: python3 scripts/smoke.py
