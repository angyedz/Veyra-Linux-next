name: Vforge source checks

on:
  pull_request:
    paths:
      - '.github/workflows/vforge-source-tests.yml'
      - 'mkosi.conf'
      - 'mkosi.veyra-base.conf'
      - 'mkosi.images/veyra-oci-rootfs/**'
      - 'mkosi.extra/usr/bin/vforge'
      - 'mkosi.extra/usr/bin/vpkg'
      - 'mkosi.extra/usr/lib/veyra/**'
      - 'mkosi.extra/usr/share/veyra/vpkg/**'
      - 'mkosi.extra/etc/yum.repos.d/rpmfusion.repo'
      - 'mkosi.extra/usr/share/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-*'
      - 'scripts/check-vforge-oci-artifact.py'
      - 'scripts/**'
      - 'tests/**'
  push:
    branches: [feature/vforge]
    paths:
      - '.github/workflows/vforge-source-tests.yml'
      - 'mkosi.conf'
      - 'mkosi.veyra-base.conf'
      - 'mkosi.images/veyra-oci-rootfs/**'
      - 'mkosi.extra/usr/bin/vforge'
      - 'mkosi.extra/usr/bin/vpkg'
      - 'mkosi.extra/usr/lib/veyra/**'
      - 'mkosi.extra/usr/share/veyra/vpkg/**'
      - 'mkosi.extra/etc/yum.repos.d/rpmfusion.repo'
      - 'mkosi.extra/usr/share/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-*'
      - 'scripts/check-vforge-oci-artifact.py'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run Vforge source and policy tests
        run: python3 -m unittest discover -s tests -q
      - name: Run repository smoke checks
        run: python3 scripts/smoke.py
      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile scripts/check-build-environment.py scripts/check-vforge-oci-artifact.py scripts/run-vforge-qemu.py scripts/test-vforge-integration-qemu.py
          bash -n scripts/test-vforge-qemu.sh
          bash -n scripts/check-build-environment.sh
      - name: Check patch whitespace
        run: git diff --check

  build-oci-rootfs:
    if: >-
      github.event_name == 'pull_request' ||
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/feature/vforge')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Use Vpkg target-branch sources for branch builds
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin feature/vpkg
          git checkout FETCH_HEAD -- \
            mkosi.extra/usr/bin/vpkg \
            mkosi.extra/usr/lib/veyra/vpkg_libdnf.py \
            mkosi.extra/usr/lib/veyra/veyra_repo.py \
            mkosi.extra/usr/share/veyra/vpkg/protected-core.json \
            mkosi.extra/etc/yum.repos.d/rpmfusion.repo \
            mkosi.extra/usr/share/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-free-fedora-2020 \
            mkosi.extra/usr/share/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-nonfree-fedora-2020
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install mkosi and OCI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            btrfs-progs ca-certificates cpio curl dnf dosfstools e2fsprogs \
            debian-archive-keyring erofs-utils fdisk gpg kmod mtools openssl \
            podman python3 squashfs-tools cryptsetup-bin systemd-container \
            systemd-ukify xz-utils zstd
      - name: Check image configuration
        run: python3 scripts/smoke.py
      - name: Gate Ubuntu DNF and Fedora 44 tools tree
        env:
          VEYRA_MKOSI_RUNNER: github-ubuntu-24.04
        run: bash scripts/check-build-environment.sh
      - name: Verify isolated Ubuntu DNF configuration
        env:
          VEYRA_MKOSI_RUNNER: github-ubuntu-24.04
        run: sudo --preserve-env=VEYRA_MKOSI_RUNNER,GITHUB_ACTIONS,RUNNER_OS python3 scripts/check-build-environment.py
      - name: Verify native mkosi build capability
        run: |
          sudo python3 -c 'import pathlib, sys; caps = int(next(line.split()[1] for line in pathlib.Path("/proc/self/status").read_text().splitlines() if line.startswith("CapEff:")), 16); available = bool(caps & (1 << 21)); print(f"CAP_SYS_ADMIN available to the ephemeral runner root: {available}"); sys.exit(0 if available else 1)'
      - name: Build installed Veyra and dependent OCI rootfs images
        run: sudo --preserve-env=PATH,VEYRA_MKOSI_RUNNER,GITHUB_ACTIONS,RUNNER_OS scripts/mkosi.sh --force build
      - name: Validate OCI archive and Vpkg runtime
        run: |
          python3 scripts/check-vforge-oci-artifact.py \
            mkosi.output/veyra-next-vforge-base.tar --require-sources
          sudo podman load --input mkosi.output/veyra-next-vforge-base.tar
          image_id="$(sudo podman images --no-trunc --format '{{.ID}} {{.Repository}}:{{.Tag}}' | awk '$2 ~ /veyra-next/ { print $1; exit }')"
          test -n "$image_id"
          sudo podman run --rm --entrypoint /usr/bin/vpkg "$image_id" container --help
          sudo podman run --rm --entrypoint /bin/sh "$image_id" -ec '
            test "$(. /usr/lib/os-release; printf %s "$VERSION_ID")" = 44
            test -d /usr/lib/sysimage/rpm
            test -x /usr/bin/vpkg
            test -s /usr/share/veyra/vpkg/protected-core.json
            test -s /etc/yum.repos.d/rpmfusion.repo
          '
      - name: Compare installed image and OCI rootfs package inventories
        run: |
          sudo --preserve-env=PATH,VEYRA_MKOSI_RUNNER,GITHUB_ACTIONS,RUNNER_OS scripts/mkosi.sh shell -- rpm -qa --qf '%{NAME}-%{EVR}.%{ARCH}\n' | sort > "$RUNNER_TEMP/main-rpms.txt"
          image_id="$(sudo podman images --no-trunc --format '{{.ID}} {{.Repository}}:{{.Tag}}' | awk '$2 ~ /veyra-next/ { print $1; exit }')"
          sudo podman run --rm --entrypoint rpm "$image_id" -qa --qf '%{NAME}-%{EVR}.%{ARCH}\n' | sort > "$RUNNER_TEMP/oci-rpms.txt"
          diff -u "$RUNNER_TEMP/main-rpms.txt" "$RUNNER_TEMP/oci-rpms.txt"
