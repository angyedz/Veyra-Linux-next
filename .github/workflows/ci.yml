name: Fedora image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install image builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            btrfs-progs ca-certificates cpio curl dosfstools e2fsprogs \
            debian-archive-keyring gpg kmod mtools openssl python3 qemu-system-x86 squashfs-tools \
            systemd-container systemd-ukify xz-utils zstd
      - name: Check image configuration
        run: python3 scripts/smoke.py
      - name: Build the Fedora KDE disk image
        run: sudo --preserve-env=PATH scripts/mkosi.sh --force build
      - name: Verify the packages inside the built image
        run: |
          sudo --preserve-env=PATH scripts/mkosi.sh shell -- sh -eux -c '
          rpm -q \
            glibc systemd plasma-workspace plasma-login-manager plasma-setup \
            flatpak gcc git cmake python3 nodejs22 fastfetch
          test -x /usr/bin/startplasma-wayland
          node --version
          test -s /usr/share/veyra/branding/veyra-logo.svg
          test -s /usr/share/veyra/branding/fetch-logo.txt
          test -s /usr/share/veyra/neofetch/logo.txt
          test -s /usr/share/veyra/screenfetch/logo.sh
          test -s /etc/xdg/fastfetch/config.jsonc
          test -s /etc/skel/.config/neofetch/config.conf
          test -s /etc/skel/.config/hyfetch.json
          test -s /etc/profile.d/veyra-fetch.sh
          bash -n /usr/share/veyra/screenfetch/logo.sh /etc/profile.d/veyra-fetch.sh
          grep -Fqx ID=veyra /etc/os-release
          grep -Fqx ID_LIKE=fedora /etc/os-release
          grep -Fqx VERSION_ID=44 /etc/os-release
          # Keep the captured output plain so module labels remain searchable.
          fastfetch --show-errors --pipe true > /tmp/veyra-fastfetch.txt
          grep -Fq "Veyra Next 0.1.0 (Fedora 44 base)" /tmp/veyra-fastfetch.txt
          grep -Fq 'OS:' /tmp/veyra-fastfetch.txt
          grep -Fq 'Kernel:' /tmp/veyra-fastfetch.txt
          grep -Fq "#######  ###############" /tmp/veyra-fastfetch.txt
          test -L /etc/systemd/system/multi-user.target.wants/plasma-setup.service
          '
      - name: Check that mkosi produced a disk image
        run: test -s mkosi.output/veyra-next.raw
