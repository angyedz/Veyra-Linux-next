name: Fedora image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install image builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            btrfs-progs ca-certificates cpio curl dosfstools e2fsprogs \
            debian-archive-keyring gpg kmod mtools openssl python3 qemu-system-x86 squashfs-tools \
            systemd-container systemd-ukify xz-utils zstd
      - name: Check image configuration
        run: python3 scripts/smoke.py
      - name: Build the Fedora KDE disk image
        run: sudo --preserve-env=PATH scripts/mkosi.sh --force build
      - name: Verify the packages inside the built image
        run: |
          sudo --preserve-env=PATH scripts/mkosi.sh shell -- sh -eu -c '
          rpm -q \
            glibc systemd plasma-workspace plasma-login-manager plasma-setup \
            flatpak gcc git cmake python3 nodejs22
          test -x /usr/bin/startplasma-wayland
          node --version
          test -s /usr/share/veyra/branding/veyra-logo.svg
          test -L /etc/systemd/system/multi-user.target.wants/plasma-setup.service
          '
      - name: Verify Glacier styles, wallpaper and global theme registration
        run: |
          sudo --preserve-env=PATH scripts/mkosi.sh shell -- sh -eu -c '
            test -x /usr/bin/veyra-theme
            test -s /usr/share/wallpapers/VeyraGlacier/contents/images/1920x1080.svg
            test -s /usr/share/wallpapers/VeyraGlacier/contents/images_dark/1920x1080.svg
            for mode in dark light; do
              test -s "/usr/share/plasma/desktoptheme/veyra-glacier-$mode/metadata.json"
              test -s "/usr/share/plasma/desktoptheme/veyra-glacier-$mode/widgets/panel-background.svg"
              for asset in button lineedit listitem plasmoidheading arrows; do
                test -s "/usr/share/plasma/desktoptheme/veyra-glacier-$mode/widgets/$asset.svg"
              done
              test -s "/usr/share/plasma/look-and-feel/org.veyra.glacier.$mode/metadata.json"
              test -s "/usr/share/plasma/look-and-feel/org.veyra.glacier.$mode/contents/defaults"
            done
            command -v plasma-apply-lookandfeel
            QT_QPA_PLATFORM=offscreen plasma-apply-lookandfeel --list | tee /tmp/veyra-theme-list
            grep -Fx org.veyra.glacier.dark /tmp/veyra-theme-list
            grep -Fx org.veyra.glacier.light /tmp/veyra-theme-list
          '
      - name: Check that mkosi produced a disk image
        run: test -s mkosi.output/veyra-next.raw
