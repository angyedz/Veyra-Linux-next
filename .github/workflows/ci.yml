name: Fedora image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vpkg-image-fixture:
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora@sha256:2d894246f63e15be3557d103c50e5fdef67bf50b34e35d54753966b9c1854608
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify the pinned Fedora 44 build container before using DNF
        run: bash scripts/check-build-environment.sh
      - name: Install package build and signing tools
        run: dnf5 install --assumeyes createrepo_c cpio distribution-gpg-keys dnf5-plugins git gnupg2 python3 rpm-build rpm-sign squashfs-tools
      - name: Build two versions of the Veyra extension RPM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/rpms build/site build/empty-rpms build/v2/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          python3 scripts/build-extension-rpm.py --channel testing --output build/rpms
          rpm_v1="$(find build/rpms -maxdepth 1 -name 'veyra-shell-tools-*.rpm' -print -quit)"
          test -s "$rpm_v1"
          mkdir -p build/v2/extract
          rpm2cpio "$rpm_v1" | (cd build/v2/extract && cpio --quiet --extract --make-directories)
          cp build/v2/extract/var/lib/extensions/veyra-shell-tools.raw build/v2/SOURCES/veyra-shell-tools.raw
          cat > build/v2/SPECS/veyra-shell-tools.spec <<'EOF'
          Name:           veyra-shell-tools
          Version:        0.2.0
          Release:        1.fc44
          Summary:        Veyra shell tools system-extension CI fixture
          License:        GPL-2.0-or-later AND MIT AND Unlicense
          BuildArch:      x86_64
          Source0:        veyra-shell-tools.raw

          %description
          Signed upgrade fixture for Veyra vpkg image integration tests.

          %prep
          %build
          %install
          install -D -m 0644 %{SOURCE0} %{buildroot}/var/lib/extensions/veyra-shell-tools.raw
          %files
          /var/lib/extensions/veyra-shell-tools.raw
          EOF
          rpmbuild -bb build/v2/SPECS/veyra-shell-tools.spec \
            --define "_topdir $PWD/build/v2" \
            --define "_sourcedir $PWD/build/v2/SOURCES" \
            --define '_build_name_fmt %{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}.rpm'
          cp build/v2/RPMS/*.rpm build/rpms/
          mkdir -p build/broken/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          printf 'This is deliberately not a filesystem image.\n' > build/broken/SOURCES/veyra-broken-extension.raw
          cat > build/broken/SPECS/veyra-broken-extension.spec <<'EOF'
          Name:           veyra-broken-extension
          Version:        0.1.0
          Release:        1.fc44
          Summary:        Deliberately invalid system-extension CI fixture
          License:        MIT
          BuildArch:      x86_64
          Source0:        veyra-broken-extension.raw

          %description
          Used only to verify that vpkg rolls back when systemd-sysext refuses an image.

          %prep
          %build
          %install
          install -D -m 0644 %{SOURCE0} %{buildroot}/var/lib/extensions/veyra-broken-extension.raw
          %files
          /var/lib/extensions/veyra-broken-extension.raw
          EOF
          rpmbuild -bb build/broken/SPECS/veyra-broken-extension.spec \
            --define "_topdir $PWD/build/broken" \
            --define "_sourcedir $PWD/build/broken/SOURCES" \
            --define '_build_name_fmt %{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}.rpm'
          mkdir -p build/incompatible/{BUILD,RPMS,SOURCES,SPECS,SRPMS} \
            build/incompatible/root/usr/lib/extension-release.d
          cat > build/incompatible/root/usr/lib/extension-release.d/extension-release.veyra-incompatible-extension <<'EOF'
          ID=fedora
          VERSION_ID=44
          SYSEXT_LEVEL=999
          EOF
          mksquashfs build/incompatible/root build/incompatible/SOURCES/veyra-incompatible-extension.raw \
            -noappend -all-root -no-progress
          cat > build/incompatible/SPECS/veyra-incompatible-extension.spec <<'EOF'
          Name:           veyra-incompatible-extension
          Version:        0.1.0
          Release:        1.fc44
          Summary:        Veyra system-extension compatibility CI fixture
          License:       MIT
          BuildArch:      x86_64
          Source0:        veyra-incompatible-extension.raw

          %description
          Used only to verify that vpkg rolls back an extension with an incompatible SYSEXT_LEVEL.

          %prep
          %build
          %install
          install -D -m 0644 %{SOURCE0} %{buildroot}/var/lib/extensions/veyra-incompatible-extension.raw
          %files
          /var/lib/extensions/veyra-incompatible-extension.raw
          EOF
          rpmbuild -bb build/incompatible/SPECS/veyra-incompatible-extension.spec \
            --define "_topdir $PWD/build/incompatible" \
            --define "_sourcedir $PWD/build/incompatible/SOURCES" \
            --define '_build_name_fmt %{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}.rpm'
          mkdir -p build/scriptlet/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          printf 'Disposable vpkg scriptlet policy fixture.\n' > build/scriptlet/SOURCES/README
          cat > build/scriptlet/SPECS/vpkg-scriptlet-fixture.spec <<'EOF'
          Name:           vpkg-scriptlet-fixture
          Version:        0.1.0
          Release:        1.fc44
          Summary:        Disposable vpkg RPM scriptlet policy fixture
          License:        MIT
          BuildArch:      x86_64
          Source0:        README

          %description
          Used only to verify that vpkg rejects packages declaring RPM hooks.

          %prep
          %build
          %install
          install -D -m 0644 %{SOURCE0} %{buildroot}/opt/vpkg-scriptlet-fixture/README
          %files
          /opt/vpkg-scriptlet-fixture/README

          %pre
          echo VEYRA_CI_SCRIPTLET_PRE_RAN
          exit 70

          %post
          echo VEYRA_CI_SCRIPTLET_POST_RAN
          touch /var/lib/veyra/vpkg-ci-scriptlet-post-ran
          exit 71

          %transfiletriggerin -- /opt/vpkg-scriptlet-fixture
          echo VEYRA_CI_SCRIPTLET_TRIGGER_RAN
          touch /var/lib/veyra/vpkg-ci-scriptlet-trigger-ran
          exit 72
          EOF
          rpmbuild -bb build/scriptlet/SPECS/vpkg-scriptlet-fixture.spec \
            --define "_topdir $PWD/build/scriptlet" \
            --define "_sourcedir $PWD/build/scriptlet/SOURCES" \
            --define '_build_name_fmt %{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}.rpm'
      - name: Sign the disposable VM test repository
        shell: bash
        run: |
          set -euo pipefail
          gpg --batch --passphrase '' --quick-generate-key 'Veyra VM CI Test Key <veyra-vm-ci@example.invalid>' rsa3072 sign 0
          fingerprint="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$fingerprint"
          gpg --batch --armor --export "$fingerprint" > build/site/RPM-GPG-KEY-VEYRA
          rpm --import build/site/RPM-GPG-KEY-VEYRA
          rpmsign --define "_gpg_name $fingerprint" --addsign \
            build/rpms/*.rpm build/broken/RPMS/*.rpm build/incompatible/RPMS/*.rpm \
            build/scriptlet/RPMS/*.rpm
          scripts/build-package-repo.sh testing build/rpms build/site
          scripts/build-package-repo.sh main build/empty-rpms build/site
          testing_repo=build/site/packages/testing/x86_64
          cp build/broken/RPMS/*.rpm build/incompatible/RPMS/*.rpm "$testing_repo/"
          createrepo_c --database --update "$testing_repo"
          testing_initial=build/site/packages/testing-initial/x86_64
          mkdir -p "$testing_initial"
          cp build/rpms/veyra-shell-tools-0.1.0-*.rpm "$testing_initial/"
          cp build/broken/RPMS/*.rpm build/incompatible/RPMS/*.rpm "$testing_initial/"
          createrepo_c --database "$testing_initial"
          for channel in main testing testing-initial; do
            metadata="build/site/packages/$channel/x86_64/repodata/repomd.xml"
            gpg --batch --yes --armor --local-user "$fingerprint" --detach-sign \
              --output "$metadata.asc" "$metadata"
          done
          upstream=build/site/local-upstream/x86_64
          mkdir -p "$upstream"
          dnf5 --repo=fedora download --resolve --alldeps --destdir="$upstream" htop
          cp build/scriptlet/RPMS/*.rpm "$upstream/"
          createrepo_c --database "$upstream"
          test -s "$upstream/repodata/repomd.xml"
          test -n "$(find "$upstream" -maxdepth 1 -name 'htop-*.rpm' -print -quit)"
          test -s "$upstream/vpkg-scriptlet-fixture-0.1.0-1.fc44.x86_64.rpm"
          test "$(find build/site/packages/testing/x86_64 -maxdepth 1 -name 'veyra-shell-tools-*.rpm' | wc -l)" -eq 2
          test -s build/site/packages/testing/x86_64/veyra-broken-extension-0.1.0-1.fc44.x86_64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-vpkg-image-fixture
          path: build/site/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: vpkg-image-fixture
    runs-on: ubuntu-24.04
    env:
      VEYRA_MKOSI_RUNNER: github-ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-vpkg-image-fixture
          path: build/vpkg-site
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install image builder dependencies on the Ubuntu runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            btrfs-progs ca-certificates cpio curl cryptsetup-bin dnf dosfstools e2fsprogs grub-common \
            erofs-utils fdisk git gnupg kmod mtools openssl ovmf python3 \
            qemu-system-x86 squashfs-tools sudo systemd-container systemd-ukify \
            xz-utils zstd
      - name: Gate the Ubuntu runner and Fedora 44 mkosi tools tree
        run: bash scripts/check-build-environment.sh
      - name: Verify Ubuntu DNF isolation and pinned Fedora 44 tools tree
        run: sudo --preserve-env=VEYRA_MKOSI_RUNNER,GITHUB_ACTIONS,RUNNER_OS python3 scripts/check-build-environment.py
      - name: Verify native mkosi build capability on the ephemeral runner VM
        run: |
          sudo python3 -c 'import pathlib, sys; caps = int(next(line.split()[1] for line in pathlib.Path("/proc/self/status").read_text().splitlines() if line.startswith("CapEff:")), 16); available = bool(caps & (1 << 21)); print(f"CAP_SYS_ADMIN available to the ephemeral runner root: {available}"); sys.exit(0 if available else 1)'
      - name: Check image configuration
        run: python3 scripts/smoke.py
      - name: Test installer package manifest, disk sizing, and media exclusion
        run: |
          python3 -m unittest discover -s tests -p 'test_veyra_installer.py' -v
          python3 -c 'from pathlib import Path; p=Path("scripts/veyra-install.py"); compile(p.read_text(), str(p), "exec")'
      - name: Test Recovery source and image installation contract
        run: python3 -m unittest discover -s tests -p 'test_recovery*.py' -v
      - name: Test v-dri sysfs inventory against isolated fixtures
        run: python3 -m unittest discover -s tests -p 'test_vdri.py' -v
      - name: Check v-dri syntax
        run: python3 -c 'from pathlib import Path; p=Path("mkosi.extra/usr/bin/v-dri"); compile(p.read_text(), str(p), "exec")'
      - name: Add guest-only v-dri QEMU smoke fixture
        run: cp -a tests/fixtures/vdri-qemu/. mkosi.extra/
      - name: Add the CI-only vpkg boot test to this disposable image
        run: |
          sudo install -D -m 0644 build/vpkg-site/RPM-GPG-KEY-VEYRA \
            mkosi.extra/usr/share/veyra/RPM-GPG-KEY-VEYRA
          sudo install -D -m 0644 tests/fixtures/vpkg-image/veyra-vpkg-ci.service \
            mkosi.extra/usr/lib/systemd/system/veyra-vpkg-ci.service
          sudo install -D -m 0644 tests/fixtures/vpkg-image/boot-complete-vpkg-ci.conf \
            mkosi.extra/usr/lib/systemd/system/boot-complete.target.d/veyra-vpkg-ci.conf
          sudo install -D -m 0644 tests/fixtures/vpkg-image/veyra-vpkg-stage-recovery.service \
            mkosi.extra/usr/lib/systemd/system/veyra-vpkg-stage-recovery.service
          sudo install -D -m 0644 tests/fixtures/vpkg-image/systemd-bless-boot-vpkg-ci.conf \
            mkosi.extra/usr/lib/systemd/system/systemd-bless-boot.service.d/veyra-vpkg-ci.conf
          sudo install -D -m 0755 tests/fixtures/vpkg-image/veyra-vpkg-ci-test \
            mkosi.extra/usr/libexec/veyra-vpkg-ci-test
          sudo install -D -m 0755 tests/fixtures/vpkg-image/veyra-vpkg-stage-recovery \
            mkosi.extra/usr/libexec/veyra-vpkg-stage-recovery
          sudo install -D -m 0644 tests/fixtures/firmware/veyra-bios-ci.service \
            mkosi.extra/usr/lib/systemd/system/veyra-bios-ci.service
          sudo install -d -m 0755 \
            mkosi.extra/usr/lib/systemd/system/graphical.target.wants
          sudo ln -s /usr/lib/systemd/system/veyra-bios-ci.service \
            mkosi.extra/usr/lib/systemd/system/graphical.target.wants/veyra-bios-ci.service
      - name: Build the Fedora KDE disk image
        run: sudo --preserve-env=PATH,VEYRA_MKOSI_RUNNER,GITHUB_ACTIONS,RUNNER_OS scripts/mkosi.sh --force build
      - name: Gate root, UKI and core RPMs on Fedora 44
        run: |
          version="$(awk -F= '/^ImageVersion=/ { print $2; exit }' mkosi.conf)"
          test -s mkosi.output/veyra-next.raw
          test -s mkosi.output/veyra-next.manifest
          test -s "mkosi.output/veyra-next_${version}.efi"
          mapfile -t recovery_ukis < <(find mkosi.output -maxdepth 1 -type f -name 'veyra-recovery*.efi' -print)
          if ((${#recovery_ukis[@]} != 1)); then
            echo "Expected exactly one Recovery UKI, found ${#recovery_ukis[@]}" >&2
            exit 1
          fi
          test -s "${recovery_ukis[0]}"
          test -s "mkosi.output/veyra-next_${version}.vmlinuz"
          test -s "mkosi.output/veyra-next_${version}.initrd"
          python3 scripts/check-image.py mkosi.output/veyra-next.raw
          sudo --preserve-env=PATH,VEYRA_MKOSI_RUNNER,GITHUB_ACTIONS,RUNNER_OS scripts/mkosi.sh shell -- sh -eu -c '
          grep -Fxq VERSION_ID=44 /usr/lib/os-release
          rpm -q --qf "%{EVR}\\n" fedora-release | grep -Eq "^44-"
          for package in systemd systemd-udev kernel-core; do
            rpm -q --qf "%{EVR}\\n" "$package" | grep -Eq "\\.fc44$"
          done
          '
      - name: Verify the packages inside the built image
        run: |
          sudo --preserve-env=PATH,VEYRA_MKOSI_RUNNER,GITHUB_ACTIONS,RUNNER_OS scripts/mkosi.sh shell -- sh -eu -c "$(cat <<'VERIFY_PACKAGES'
          check() { label="$1"; shift; echo "Checking: $label"; "$@"; }
          rpm -q \
            glibc systemd systemd-udev kernel grub2-pc grub2-tools-minimal plasma-workspace plasma-login-manager plasma-setup \
            flatpak libdnf5 python3-libdnf5 util-linux gcc git cmake python3 nodejs22
          test "$(rpm -E '%{fedora}')" = 44
          grep -Fxq 'ID=fedora' /usr/lib/os-release
          grep -Fxq 'VERSION_ID=44' /usr/lib/os-release
          test "$(rpm -q --qf '%{RELEASE}\n' libdnf5 python3-libdnf5 | grep -Ec '\.fc44$')" -eq 2
          ! rpm -q dnf5 dnf5-plugins
          check systemd-sysupdate test -x /usr/lib/systemd/systemd-sysupdate
          check vpkg test -x /usr/bin/vpkg
          check python-libdnf5 python3 -c "import libdnf5"
          check dnf5-cli-absent sh -eu -c "! command -v dnf5"
          check vforge test -x /usr/bin/vforge
          check vforge-help /usr/bin/vforge --help
          check v-dri test -x /usr/bin/v-dri
          check unshare /usr/bin/unshare --help
          check mount /usr/bin/mount --version
          check no-podman-cli sh -eu -c "! command -v podman"
          check veyra-update test -x /usr/bin/veyra-update
          check veyra-update-help /usr/bin/veyra-update --help
          check vforge-base-service test -s /usr/lib/systemd/system/veyra-vforge-base.service
          check vforge-base-service-enabled test -L /usr/lib/systemd/system/multi-user.target.wants/veyra-vforge-base.service
          check vforge-base-service-target test "$(readlink /usr/lib/systemd/system/multi-user.target.wants/veyra-vforge-base.service)" = /usr/lib/systemd/system/veyra-vforge-base.service
          check plasma-wayland test -x /usr/bin/startplasma-wayland
          node --version
          check branding test -s /usr/share/veyra/branding/veyra-logo.svg
          check prototype-branding sh -eu -c "grep -Fq 'Veyra Next Prototype' /etc/os-release && grep -Fxq 'Track: prototype' /etc/veyra-release"
          check pinned-rpm-repository-key test -s /usr/share/veyra/RPM-GPG-KEY-VEYRA
          check veyra-sysext-level sh -eu -c "grep -Fxq SYSEXT_LEVEL=1 /etc/os-release && grep -Fxq SYSEXT_LEVEL=1 /usr/lib/os-release"
          check plasma-setup-enabled sh -eu -c "find /etc/systemd/system -type l -name plasma-setup.service -print -quit | grep -q ."
          check systemd-sysext-enabled sh -eu -c "find /etc/systemd/system -type l -name systemd-sysext.service -print -quit | grep -q ."
          check bios-ci-service test -s /usr/lib/systemd/system/veyra-bios-ci.service
          check bios-ci-service-enabled test -L /usr/lib/systemd/system/graphical.target.wants/veyra-bios-ci.service
          check bios-ci-service-target test "$(readlink /usr/lib/systemd/system/graphical.target.wants/veyra-bios-ci.service)" = /usr/lib/systemd/system/veyra-bios-ci.service
          check vpkg-sync-service test -s /usr/lib/systemd/system/veyra-vpkg-sync.service
          check sysext-vpkg-ordering test -s /usr/lib/systemd/system/systemd-sysext.service.d/veyra-vpkg.conf
          VERIFY_PACKAGES
          )"
      - name: Check that mkosi produced update assets
        run: |
          version="$(awk -F= '/^ImageVersion=/ { print $2; exit }' mkosi.conf)"
          test -s "mkosi.output/veyra-next_${version}.efi"
          test -s "mkosi.output/veyra-next_${version}.vmlinuz"
          test -s "mkosi.output/veyra-next_${version}.initrd"
          find mkosi.output -maxdepth 1 -name "veyra-next_${version}_*.root.raw.zst" -type f -size +0c | grep -q .
          find mkosi.output -maxdepth 1 -name "veyra-next_${version}_*.root-verity.raw.zst" -type f -size +0c | grep -q .
          # The BIOS QEMU harness temporarily injects serial boot diagnostics into this disposable image.
          sudo chown "$(id -u):$(id -g)" mkosi.output/veyra-next.raw

      - name: Boot Fedora 44 with a virtual GPU and verify v-dri
        run: python3 scripts/test-vdri-qemu.py mkosi.output/veyra-next.raw --timeout 600

      - name: Boot the image through Legacy BIOS in QEMU
        run: python3 scripts/test-bios-boot.py --image mkosi.output/veyra-next.raw --report-dir build/bios-boot --timeout 1200
      - name: Upload Legacy BIOS boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-bios-boot-diagnostics
          path: build/bios-boot/
          if-no-files-found: ignore
          retention-days: 3

      - name: Run signed OTA integration inside a disposable QEMU guest
        run: |
          set -euo pipefail
          version="$(awk -F= '/^ImageVersion=/ { print $2; exit }' mkosi.conf)"
          export GNUPGHOME="$RUNNER_TEMP/veyra-sysupdate-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key "Veyra temporary CI update key" ed25519 sign 0
          fingerprint="$(gpg --batch --with-colons --list-secret-keys |
            awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$fingerprint"
          gpg --batch --export "$fingerprint" > "$RUNNER_TEMP/veyra-ci-update-key.gpg"

          ovmf_code=""
          for candidate in \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            /usr/share/OVMF/OVMF_CODE.fd \
            /usr/share/edk2/x64/OVMF_CODE.4m.fd; do
            if [[ -s "$candidate" ]]; then ovmf_code="$candidate"; break; fi
          done
          ovmf_vars=""
          for candidate in \
            /usr/share/OVMF/OVMF_VARS_4M.fd \
            /usr/share/OVMF/OVMF_VARS.fd \
            /usr/share/edk2/x64/OVMF_VARS.4m.fd; do
            if [[ -s "$candidate" ]]; then ovmf_vars="$candidate"; break; fi
          done
          test -n "$ovmf_code" && test -n "$ovmf_vars"
          sudo --preserve-env=PATH,GNUPGHOME python3 scripts/test-sysupdate-image.py \
            --image mkosi.output/veyra-next.raw \
            --current-version "$version" \
            --transfer-dir mkosi.extra/usr/lib/sysupdate.d \
            --vpkg-test-repo build/vpkg-site \
            --fingerprint "$fingerprint" \
            --ovmf-code "$ovmf_code" \
            --ovmf-vars "$ovmf_vars" \
            --boot-timeout 1200

      - name: Build target-version artifacts for Legacy BIOS OTA
        run: |
          set -euo pipefail
          current_version="$(awk -F= '/^ImageVersion=/ { print $2; exit }' mkosi.conf)"
          candidate_version="$(python3 - "$current_version" <<'PY'
          import sys
          components = sys.argv[1].split(".")
          if not components or any(not part.isdecimal() for part in components):
              raise SystemExit("ImageVersion must be numeric for the OTA fixture")
          components[-1] = str(int(components[-1]) + 1)
          print(".".join(components))
          PY
          )"
          sudo --preserve-env=PATH,VEYRA_MKOSI_RUNNER,GITHUB_ACTIONS,RUNNER_OS \
            scripts/mkosi.sh --force --image-version "$candidate_version" \
            --output-directory build/bios-ota-candidate build
          test -s build/bios-ota-candidate/veyra-next.raw
          test -s build/bios-ota-candidate/veyra-next.osrelease
          grep -Fxq "IMAGE_VERSION=\"$candidate_version\"" \
            build/bios-ota-candidate/veyra-next.osrelease
          test -s "build/bios-ota-candidate/veyra-next_${candidate_version}.vmlinuz"
          test -s "build/bios-ota-candidate/veyra-next_${candidate_version}.initrd"
          find build/bios-ota-candidate -maxdepth 1 \
            -name "veyra-next_${candidate_version}_*.root.raw.zst" -type f -size +0c | grep -q .

      - name: Run signed Legacy BIOS OTA, GRUB bless, and rollback in QEMU
        run: |
          set -euo pipefail
          version="$(awk -F= '/^ImageVersion=/ { print $2; exit }' mkosi.conf)"
          export GNUPGHOME="$RUNNER_TEMP/veyra-bios-ota-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key "Veyra temporary BIOS CI update key" ed25519 sign 0
          fingerprint="$(gpg --batch --with-colons --list-secret-keys |
            awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$fingerprint"
          sudo --preserve-env=PATH,GNUPGHOME python3 scripts/test-sysupdate-image.py \
            --image mkosi.output/veyra-next.raw \
            --current-version "$version" \
            --transfer-dir mkosi.extra/usr/lib/sysupdate.d \
            --firmware bios \
            --candidate-dir build/bios-ota-candidate \
            --vpkg-test-repo build/vpkg-site \
            --fingerprint "$fingerprint" \
            --log-directory build/bios-ota-logs \
            --boot-timeout 1200
      - name: Prepare Recovery UKI for the Live Installer ISO
        run: |
          set -euo pipefail
          mapfile -t recovery_ukis < <(find mkosi.output -maxdepth 1 -type f -name 'veyra-recovery*.efi' -print)
          if ((${#recovery_ukis[@]} != 1)); then
            echo "Expected exactly one Recovery UKI, found ${#recovery_ukis[@]}" >&2
            exit 1
          fi
          install -D -m 0644 "${recovery_ukis[0]}" build/recovery-uki/veyra-recovery.efi
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-recovery-uki
          path: build/recovery-uki/veyra-recovery.efi
          if-no-files-found: error
          retention-days: 1
      - name: Upload Legacy BIOS OTA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-bios-ota-diagnostics
          path: build/bios-ota-logs/
          if-no-files-found: ignore
          retention-days: 3

  live-installer-iso:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora@sha256:2d894246f63e15be3557d103c50e5fdef67bf50b34e35d54753966b9c1854608
      options: >-
        --cap-add=SYS_ADMIN
        --device=/dev/loop-control
        --device-cgroup-rule="b 7:* rmw"
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: veyra-recovery-uki
          path: build/recovery-uki
      - name: Install Fedora 44 Live ISO build tools
        run: dnf5 install --assumeyes curl gnupg2 lorax-lmc-novirt anaconda-tui xorriso isomd5sum squashfs-tools
      - name: Download and verify the Fedora 44 Anaconda boot ISO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/fedora-netinst
          base_url=https://download.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/iso
          iso_name=Fedora-Everything-netinst-x86_64-44-1.7.iso
          curl --fail --location --retry 5 "$base_url/$iso_name" -o "build/fedora-netinst/$iso_name"
          curl --fail --location --retry 5 "$base_url/Fedora-Everything-44-1.7-x86_64-CHECKSUM" \
            -o build/fedora-netinst/CHECKSUM
          curl --fail --location --retry 5 https://fedoraproject.org/fedora.gpg \
            -o build/fedora-netinst/fedora.gpg
          gpgv --keyring build/fedora-netinst/fedora.gpg \
            --output build/fedora-netinst/SHA256SUMS build/fedora-netinst/CHECKSUM
          checksum_line="$(awk -v file="$iso_name" '$1 == "SHA256" && $2 == "(" file ")" { print $4 " *" file }' \
            build/fedora-netinst/SHA256SUMS)"
          test -n "$checksum_line"
          (cd build/fedora-netinst && printf '%s\n' "$checksum_line" | sha256sum --check --status)
      - name: Build one Live Installer ISO and enforce the 8 GiB limit
        env:
          VEYRA_FEDORA_BOOT_ISO: ${{ github.workspace }}/build/fedora-netinst/Fedora-Everything-netinst-x86_64-44-1.7.iso
        run: bash scripts/build-live-iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: veyra-next-prototype-live-iso
          path: |
            build/live-iso/veyra-next-prototype-live.iso
            build/live-iso/veyra-next-prototype-live.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
