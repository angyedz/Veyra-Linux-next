name: Fedora image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install image builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            btrfs-progs ca-certificates cpio curl dosfstools e2fsprogs \
            gpg kmod mtools openssl python3 qemu-system-x86 squashfs-tools \
            systemd-container systemd-ukify xz-utils zstd
      - name: Check image configuration
        run: python3 scripts/smoke.py
      - name: Build the Fedora KDE disk image
        run: sudo --preserve-env=PATH scripts/mkosi.sh --force build
      - name: Verify the packages inside the built image
        run: >-
          sudo --preserve-env=PATH scripts/mkosi.sh shell -- rpm -q
          glibc systemd plasma-workspace plasma-workspace-wayland
          plasma-login-manager flatpak gcc git
      - name: Check that mkosi produced a disk image
        run: test -s mkosi.output/veyra-next.raw
