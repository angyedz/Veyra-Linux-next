name: Image policy source checks

on:
  pull_request:
    paths:
      - 'mkosi.conf'
      - 'mkosi.postinst.chroot'
      - 'mkosi.extra/usr/lib/systemd/system-preset/99-veyra.preset'
      - 'mkosi.extra/usr/share/veyra/flathub.flatpakrepo'
      - 'scripts/mkosi.sh'
      - 'README.md'
      - 'tests/test_image_policy.py'
      - '.github/workflows/image-policy.yml'
  push:
    branches: [main]
    paths:
      - 'mkosi.conf'
      - 'mkosi.postinst.chroot'
      - 'mkosi.extra/usr/lib/systemd/system-preset/99-veyra.preset'
      - 'mkosi.extra/usr/share/veyra/flathub.flatpakrepo'
      - 'scripts/mkosi.sh'
      - 'README.md'
      - 'tests/test_image_policy.py'
      - '.github/workflows/image-policy.yml'

permissions:
  contents: read

jobs:
  image-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_image_policy.py' -v
