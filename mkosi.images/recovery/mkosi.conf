[Distribution]
Distribution=fedora
Release=44
Architecture=x86-64
RepositoryKeyFetch=yes

[Output]
Format=uki
Output=veyra-recovery
OutputDirectory=mkosi.output
ImageId=veyra-recovery
ImageVersion=0.1.0
UnifiedKernelImages=unsigned
CompressOutput=no

[Content]
Bootable=yes
Packages=kernel-core
Packages=systemd
Packages=systemd-boot-unsigned
Packages=systemd-udev
Packages=util-linux
Packages=kmod
Packages=bash
Packages=python3
WithDocs=no
KernelCommandLine=rdinit=/init console=tty0 console=ttyS0,115200n8
