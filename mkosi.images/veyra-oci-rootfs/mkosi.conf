[Include]
Include=%D/mkosi.veyra-base.conf

[Output]
Format=oci-archive
Output=veyra-next-vforge-base
OciLabels=org.veyra.base.id=%i
OciLabels=org.veyra.base.version=%v
OciLabels=org.veyra.base.schema=1
OciAnnotations=org.veyra.base.id=%i
OciAnnotations=org.veyra.base.version=%v
OciAnnotations=org.veyra.base.schema=1

[Content]
Bootable=no
Initrds=
ExtraTrees=%D/mkosi.extra/usr/bin/vpkg:/usr/bin/vpkg
ExtraTrees=%D/mkosi.extra/usr/lib/veyra/vpkg_libdnf.py:/usr/lib/veyra/vpkg_libdnf.py
ExtraTrees=%D/mkosi.extra/usr/lib/veyra/veyra_repo.py:/usr/lib/veyra/veyra_repo.py
ExtraTrees=%D/mkosi.extra/usr/share/veyra/vpkg/protected-core.json:/usr/share/veyra/vpkg/protected-core.json
ExtraTrees=%D/mkosi.extra/etc/yum.repos.d/rpmfusion.repo:/etc/yum.repos.d/rpmfusion.repo
ExtraTrees=%D/mkosi.extra/usr/share/pki/rpm-gpg:/usr/share/pki/rpm-gpg
